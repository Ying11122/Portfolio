<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="contacto.css">
</head>
<body>

    <h1>Formulario de contacto</h1>
    <form action="recibido.html" method="get" onsubmit="alert('Mensaje enviado!')">
        <label for="nombre"><span>*</span>Nombre</label>
        <input type="text" name="nombre" id="nombre" required>
        

        <label for="apellidos">Apellidos</label>
        <input type="text" name="apellidos" id="apellidos">
        

        <label for="email"><span>*</span>Email</label>
        <input type="email" name="email" id="email" required>
        

        <label for="tel">Teléfono</label>
        <input type="tel" pattern="[0-9]*" name="tel" id="tel">
        

        <label for="asunto"><span>*</span>Asunto</label>
        <input type="text" name="asunto" id="asunto" required>
        
        
        <label for="comentario">Comentarios</label>
        <textarea name="comentario" id="comentario" maxlength="150 caracteres" placeholder="Escribe aquí tu comentario"></textarea> <small class="comentario">Máx. 150 caracteres</small>
        <br>
        
        <div class="botones">
            <button type="submit">Enviar</button>
            <br>
            <button type="reset" value="Borrar todo">Borrar todo</button>
        </div>
        <small><span>*</span>Campos requeridos</small>

    </form>

</body>
</html>
